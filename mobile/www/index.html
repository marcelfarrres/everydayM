<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Everyday M</title>
<style>
  html, body { height: 100%; margin: 0; background: #e9e9e7; color: #131313;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; justify-content: center;
    gap: 12px; padding: 32px; box-sizing: border-box; }
  h1 { font-size: 34px; letter-spacing: -0.03em; margin: 0; }
  p { font-size: 17px; line-height: 1.4; margin: 0; color: rgba(19,19,19,.6); }
  button { margin-top: 12px; height: 56px; border: 0; border-radius: 999px; background: #131313;
    color: #fff; font-size: 17px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Sin conexión</h1>
  <p>Everyday M necesita internet para traer la rutina de hoy.</p>
  <button onclick="location.href = window.CAP_SERVER || '/'; location.reload()">Reintentar</button>
</main>
</body>
</html>
